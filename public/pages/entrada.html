<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - Entrada de Mercadoria</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
      <nav>
          <a href="../index.html">WMS</a>
          <span>Menu principal</span>
      </nav>
  </header>

  <main>
    <h2>Entrada de Mercadoria</h2>
    
    <form id="formEntrada" style="margin-bottom: 30px; background: #f9f9f9; padding: 20px; border-radius: 8px; max-width: 500px;">
        <div style="margin-bottom: 15px;">
            <label for="produto_id">Produto:</label><br>
            <select id="produto_id" required style="width: 100%; padding: 8px; margin-top: 5px;">
                <option value="">Selecione um produto...</option>
            </select>
        </div>
    
        <div style="margin-bottom: 15px;">
          <label for="endereço_id">Endereço de Armazenagem:</label><br>
          <select id="endereço_id" required style="width: 100%; padding: 8px; margin-top: 5px;">
              <option value="">Selecione um Endereço...</option>
          </select>    
        </div>

        <div style="margin-bottom: 15px;">
            <label for="quantidade">Quantidade:</label><br>
            <input type="number" id="quantidade" min="1" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="nota_fiscal">Nota Fiscal:</label><br>
            <input type="text" id="nota_fiscal" style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        

  </main>

  <script src="../js/entrada.js"></script>
</body>
</html>
