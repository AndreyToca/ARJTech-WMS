<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="pagina-login">
  <!--
    TELA: Login  —  Responsável: ANDREY
    Lado esquerdo: cena do armazém (só decoração, feita em SVG e animada no login.css).
    Lado direito: formulário. A lógica fica no arquivo public/js/login.js.
  -->

  <section class="cena" aria-hidden="true">
    <div class="cena-texto">
      <div class="marca">
        <svg class="marca-icone" viewBox="0 0 32 32">
          <path d="M16 3 28 9v14l-12 6-12-6V9z" fill="#f5b301"/>
          <path d="M16 3 28 9 16 15 4 9z" fill="#ffd25a"/>
          <path d="M16 15v14M10 6l12 6v5" stroke="#c98f00" stroke-width="1.5" fill="none"/>
        </svg>
        <span>ARJtech <strong>WMS</strong></span>
      </div>
      <h2>Seu armazém,<br>sob controle.</h2>
      <ul class="etapas">
        <li>Recebimento</li>
        <li>Armazenagem</li>
        <li>Expedição</li>
      </ul>
    </div>

    <svg class="armazem" viewBox="0 0 640 420">
      <defs>
        <!-- Caixa de papelão reaproveitada em toda a cena -->
        <symbol id="caixa" viewBox="0 0 40 32" preserveAspectRatio="none">
          <rect width="40" height="32" rx="2" fill="#c8915a"/>
          <rect x="17" width="6" height="32" fill="#a8743f" opacity=".7"/>
          <rect x="4" y="21" width="10" height="7" fill="#f3e6d3"/>
        </symbol>
        <linearGradient id="cone-luz" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd666" stop-opacity=".28"/>
          <stop offset="1" stop-color="#ffd666" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- Luminárias -->
      <g class="luminaria">
        <path d="M104 50h32l-8-12h-16zM314 50h32l-8-12h-16zM524 50h32l-8-12h-16z" fill="#3a5577"/>
        <polygon class="luz" points="104,50 136,50 210,330 30,330" fill="url(#cone-luz)"/>
        <polygon class="luz" points="314,50 346,50 420,330 240,330" fill="url(#cone-luz)" style="animation-delay:-2s"/>
        <polygon class="luz" points="524,50 556,50 630,330 450,330" fill="url(#cone-luz)" style="animation-delay:-4s"/>
      </g>

      <!-- Porta-paletes 1 -->
      <g>
        <rect x="30" y="120" width="7" height="210" fill="#2d5d8f"/>
        <rect x="130" y="120" width="7" height="210" fill="#2d5d8f"/>
        <rect x="230" y="120" width="7" height="210" fill="#2d5d8f"/>
        <rect x="30" y="120" width="207" height="6" fill="#f08a24"/>
        <rect x="30" y="190" width="207" height="6" fill="#f08a24"/>
        <rect x="30" y="260" width="207" height="6" fill="#f08a24"/>
        <use href="#caixa" x="42" y="158" width="38" height="32"/>
        <use href="#caixa" x="84" y="166" width="30" height="24"/>
        <use href="#caixa" x="144" y="160" width="40" height="30"/>
        <use href="#caixa" x="190" y="170" width="28" height="20"/>
        <use href="#caixa" x="46" y="230" width="36" height="30"/>
        <use href="#caixa" x="150" y="226" width="34" height="34"/>
        <use href="#caixa" x="188" y="236" width="30" height="24"/>
        <use href="#caixa" x="40" y="296" width="44" height="34"/>
        <use href="#caixa" x="88" y="306" width="32" height="24"/>
        <use href="#caixa" x="146" y="300" width="40" height="30"/>
      </g>

      <!-- Porta-paletes 2 -->
      <g>
        <rect x="262" y="150" width="7" height="180" fill="#2d5d8f"/>
        <rect x="342" y="150" width="7" height="180" fill="#2d5d8f"/>
        <rect x="422" y="150" width="7" height="180" fill="#2d5d8f"/>
        <rect x="262" y="150" width="167" height="6" fill="#f08a24"/>
        <rect x="262" y="240" width="167" height="6" fill="#f08a24"/>
        <use href="#caixa" x="276" y="210" width="34" height="30"/>
        <use href="#caixa" x="356" y="216" width="40" height="24"/>
        <use href="#caixa" x="274" y="300" width="40" height="30"/>
        <use href="#caixa" x="358" y="292" width="34" height="38"/>
      </g>

      <!-- Doca -->
      <g>
        <text x="537" y="168" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing="2" fill="#f5b301">DOCA 01</text>
        <circle class="sinal-doca" cx="610" cy="164" r="4" fill="#3ddc84"/>
        <rect x="455" y="180" width="165" height="150" fill="#0a1626"/>
        <rect x="455" y="180" width="165" height="72" fill="#3a5577"/>
        <path d="M455 194h165M455 208h165M455 222h165M455 236h165" stroke="#2c4566" stroke-width="2"/>
        <rect x="455" y="248" width="165" height="6" fill="#f5b301"/>
        <rect x="455" y="180" width="165" height="150" fill="none" stroke="#8a9bb0" stroke-width="4"/>
      </g>

      <!-- Piso -->
      <rect y="330" width="640" height="90" fill="#0d1d30"/>
      <rect y="330" width="640" height="3" fill="#2c4566"/>
      <path d="M0 356h640" stroke="#f5b301" stroke-width="3" stroke-dasharray="22 16" opacity=".55"/>

      <!-- Caminhão: estacionado na doca; o CSS faz ele chegar e ir embora -->
      <g transform="translate(400 0)">
        <g class="caminhao">
          <rect x="0" y="206" width="160" height="114" rx="4" fill="#e8edf3"/>
          <rect x="0" y="294" width="160" height="10" fill="#f5b301"/>
          <text x="18" y="252" font-size="20" font-weight="bold" fill="#1f3a5f">ARJtech</text>
          <text x="18" y="270" font-size="10" letter-spacing="3" fill="#5b6b80">LOGÍSTICA</text>
          <path d="M164 238h34q8 0 12 8l14 30v44h-60z" fill="#f5b301"/>
          <path d="M190 246h8q4 0 6 4l12 24h-26z" fill="#9fd3ff" opacity=".85"/>
          <path d="M168 284h40" stroke="#c98f00" stroke-width="2"/>
          <rect x="216" y="298" width="7" height="8" fill="#fff6c2"/>
          <rect x="0" y="318" width="228" height="8" fill="#0b1828"/>
          <g class="roda"><circle cx="40" cy="332" r="13" fill="#0b1828"/><circle cx="40" cy="332" r="6" fill="#8a9bb0"/><rect x="39" y="321" width="2" height="22" fill="#8a9bb0"/></g>
          <g class="roda"><circle cx="76" cy="332" r="13" fill="#0b1828"/><circle cx="76" cy="332" r="6" fill="#8a9bb0"/><rect x="75" y="321" width="2" height="22" fill="#8a9bb0"/></g>
          <g class="roda"><circle cx="196" cy="332" r="13" fill="#0b1828"/><circle cx="196" cy="332" r="6" fill="#8a9bb0"/><rect x="195" y="321" width="2" height="22" fill="#8a9bb0"/></g>
        </g>
      </g>

      <!-- Empilhadeira: vai e volta carregando um palete -->
      <g transform="translate(20 0)">
        <g class="empilhadeira">
          <g class="empilhadeira-corpo">
            <rect x="0" y="346" width="82" height="44" rx="8" fill="#f5b301"/>
            <rect x="0" y="356" width="14" height="34" rx="4" fill="#d99a00"/>
            <rect x="16" y="300" width="4" height="48" fill="#1b2a3d"/>
            <rect x="64" y="300" width="4" height="48" fill="#1b2a3d"/>
            <rect x="12" y="296" width="60" height="6" rx="2" fill="#1b2a3d"/>
            <rect x="24" y="290" width="6" height="6" fill="#1b2a3d"/>
            <circle class="farol" cx="27" cy="288" r="4" fill="#ff9a1f"/>
            <rect x="28" y="326" width="6" height="20" fill="#1b2a3d"/>
            <rect x="36" y="322" width="16" height="24" rx="5" fill="#2d5d8f"/>
            <rect x="36" y="332" width="16" height="3" fill="#d6ff4d"/>
            <circle cx="44" cy="314" r="7" fill="#f1c27d"/>
            <path d="M36 313a8 8 0 0 1 16 0z" fill="#fff"/>
            <path d="M58 338l6-12" stroke="#1b2a3d" stroke-width="3" stroke-linecap="round"/>
            <rect x="84" y="284" width="6" height="106" fill="#1b2a3d"/>
            <rect x="92" y="284" width="4" height="106" fill="#2c3e55"/>
            <g class="garfo">
              <rect x="98" y="352" width="5" height="36" fill="#1b2a3d"/>
              <rect x="98" y="386" width="52" height="4" fill="#1b2a3d"/>
              <rect x="101" y="378" width="48" height="8" fill="#8b5a2b"/>
              <rect x="101" y="378" width="48" height="2" fill="#a8743f"/>
              <use href="#caixa" x="103" y="346" width="44" height="32"/>
              <use href="#caixa" x="112" y="322" width="28" height="24"/>
            </g>
            <circle cx="18" cy="396" r="11" fill="#0b1828"/>
            <circle cx="18" cy="396" r="4" fill="#8a9bb0"/>
            <circle cx="70" cy="394" r="13" fill="#0b1828"/>
            <circle cx="70" cy="394" r="5" fill="#8a9bb0"/>
          </g>
        </g>
      </g>
    </svg>
  </section>

  <main class="lado-form">
    <form id="form-login" class="login-cartao">
      <div class="faixa-alerta"></div>
      <h1>Entrar</h1>
      <p class="subtitulo">Acesse com seu e-mail e senha.</p>

      <div class="campo">
        <label for="email">E-mail</label>
        <div class="entrada-icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input type="email" id="email" name="email" autocomplete="username" placeholder="voce@wms.com" required autofocus>
        </div>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="entrada-icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="••••••" required>
          <button type="button" id="mostrar-senha" class="botao-olho" aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="risco" d="M4 4l16 16"/></svg>
          </button>
        </div>
      </div>

      <p id="mensagem-erro" class="mensagem-erro" role="alert" hidden></p>

      <button type="submit" class="botao-entrar">
        <span class="spinner"></span>
        <span class="rotulo">Entrar</span>
        <svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
