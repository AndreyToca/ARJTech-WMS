<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - Estoque</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!--
    TELA: Estoque  —  Responsável: FELIPE
    PASSO A PASSO
    1. Criar um campo de busca por produto.
    2. Criar a tabela com: produto, endereço e quantidade.
    3. (Extra) Destacar em vermelho produtos com estoque baixo.
    4. A lógica fica no arquivo public/js/estoque.js.
  -->

  <header>
    <a href="/index.html">WMS</a>
    <h1>Estoque</h1>
  </header>

  <main>
    <!-- 1. Campo de busca por produto -->
    <div style="margin-bottom: 20px;">
        <label for="busca-produto">Buscar produto:</label>
        <input type="text" id="busca-produto" placeholder="Nome do produto...">
    </div>

    <!-- 2. Tabela com: produto, endereço e quantidade -->
    <table border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Endereço</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody id="tbody-estoque">
            <!-- O JavaScript vai injetar as linhas aqui -->
        </tbody>
    </table>
  </main>

  <script src="/js/estoque.js"></script>
</body>
</html>
