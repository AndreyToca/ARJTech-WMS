<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - Estoque</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/modulos.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/estoque-mapa.css">
</head>
<body class="pagina-menu pagina-modulo" data-modulo="estoque">
  <!--
    TELA: Estoque  —  Responsável: FELIPE
    Topo e barra lateral são montados pelo /js/layout.js (mesmo visual do Painel).
    A lógica fica no arquivo public/js/estoque.js.
  -->

  <main>
    <div class="cabecalho">
      <h1>Estoque</h1>
      <p>Saldo atual por produto e endereço. Em vermelho: menos de 10 unidades.</p>
    </div>

    <!-- Resumo (preenchido pelo estoque.js; acompanha a busca) -->
    <section class="indicadores" id="indicadores-estoque" aria-label="Resumo do estoque"></section>

    <section class="bloco" aria-labelledby="titulo-saldos">
      <div class="bloco-topo">
        <h2 id="titulo-saldos">Saldos</h2>
        <div class="topo-acoes">
          <div class="alternador visao" role="radiogroup" aria-label="Forma de ver o estoque">
            <label><input type="radio" name="visao" value="lista" checked><span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lista</span></label>
            <label><input type="radio" name="visao" value="mapa"><span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>Mapa do armazém</span></label>
          </div>
          <label class="filtro">Buscar
            <input type="search" id="busca-produto" placeholder="Produto, código ou endereço">
          </label>
        </div>
      </div>
      <div id="mapa-armazem" hidden></div>
      <div class="tabela-rolagem" id="visao-lista">
        <table class="tabela">
          <thead>
            <tr>
              <th>Código</th>
              <th>Produto</th>
              <th>Endereço</th>
              <th class="num">Quantidade</th>
              <th class="num">Custo médio</th>
              <th class="num">Preço de venda</th>
              <th class="num">Valor em estoque</th>
            </tr>
          </thead>
          <tbody id="tbody-estoque"></tbody>
          <tfoot>
            <tr>
              <th colspan="6" class="num">Valor total em estoque</th>
              <th class="num" id="total-estoque">R$ 0,00</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/estoque-mapa.js"></script>
  <script src="/js/estoque.js"></script>
</body>
</html>
